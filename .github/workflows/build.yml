name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cython==0.29.33
          pip install buildozer

      - name: Clone python-for-android
        run: |
          git clone https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android

      - name: Build APK with Buildozer
        run: |
          buildozer android clean
          buildozer -v android debug 2>&1 | tee build.log
          echo "=== END OF BUILD LOG ==="
        continue-on-error: true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK if exists
        uses: actions/upload-artifact@v4
        with:
          name: mynotes-apk
          path: ./bin/*.apk
        continue-on-error: true

      - name: Check build result
        run: |
          if ls ./bin/*.apk 1> /dev/null 2>&1; then
            echo "✅ APK created successfully!"
          else
            echo "❌ APK not found. Check build.log in artifacts"
            exit 1
          fi
