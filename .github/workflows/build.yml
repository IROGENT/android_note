name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Update buildozer.spec
      run: |
        sed -i 's/requirements = python3==3.11.0, kivy/requirements = python3==3.11.0,kivy,kivymd,plyer/' buildozer.spec

    - name: Clean cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin

    - name: Download NDK 28c
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        wget https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
        unzip -q android-ndk-r28c-linux.zip
        rm android-ndk-r28c-linux.zip

    - name: Build APK
      run: |
        export ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r28c
        export ANDROID_NDK_HOME=/home/runner/.buildozer/android/platform/android-ndk-r28c
        export ANDROID_NDK_VERSION=28c
        buildozer -v android debug 2>&1 | tee build.log
        tail -100 build.log

    - name: Check if APK exists
      run: |
        ls -la bin/ || echo "No bin directory"
        find . -name "*.apk" || echo "No APK files found"

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: mynotes-apk
        path: bin/*.apk

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
